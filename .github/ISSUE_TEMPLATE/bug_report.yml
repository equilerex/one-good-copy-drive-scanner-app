name: Bug report
description: Something does not work or looks wrong
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux AppImage, Linux tarball, Windows (Store)]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution and version. Desktop (GNOME, KDE, ...) if you know it.
      placeholder: Ubuntu 24.04, GNOME on Wayland
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.2.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw. Add a screenshot if it helps.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: The end of logs/app.log, and any crash-*.log, from the data folder (see the README). They list folder and file names from your scans, so look before you paste.
      render: text
